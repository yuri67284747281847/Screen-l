```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Notificação Compacto</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-2">

    <div class="w-full max-w-sm bg-slate-800 rounded-xl shadow-lg border border-slate-700 p-3.5 space-y-3 relative overflow-hidden">
        
        <!-- Header -->
        <div class="flex items-center justify-between border-b border-slate-700 pb-2">
            <h1 class="text-sm font-bold text-emerald-400 flex items-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                Tester Notificações
            </h1>
            <span id="permissionStatus" class="text-[10px] px-2 py-0.5 rounded-full font-medium bg-amber-500/20 text-amber-300 border border-amber-500/30">
                Checando...
            </span>
        </div>

        <!-- Feedback Toast -->
        <div id="toast" class="hidden text-xs p-2 rounded-lg bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 transition-all"></div>

        <!-- Form -->
        <form id="notifForm" class="space-y-2.5">
            
            <!-- App Name & Icon -->
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[11px] font-medium text-slate-300 mb-0.5">Nome do App</label>
                    <input type="text" id="appName" value="Meu App" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-slate-300 mb-0.5">Ícone (Foto)</label>
                    <label class="flex items-center justify-center gap-1 w-full bg-slate-900 border border-slate-700 hover:border-slate-500 rounded-lg px-2 py-1 text-xs text-slate-300 cursor-pointer truncate">
                        <svg class="w-3.5 h-3.5 text-emerald-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        <span id="fileName" class="truncate text-[10px]">Escolher...</span>
                        <input type="file" id="iconInput" accept="image/*" class="hidden">
                    </label>
                </div>
            </div>

            <!-- Title -->
            <div>
                <label class="block text-[11px] font-medium text-slate-300 mb-0.5">Título</label>
                <input type="text" id="notifTitle" value="Olá, mundo!" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
            </div>

            <!-- Body Message -->
            <div>
                <label class="block text-[11px] font-medium text-slate-300 mb-0.5">Mensagem</label>
                <textarea id="notifBody" rows="2" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-slate-100 focus:outline-none focus:border-emerald-500 resize-none">Esta é uma notificação de teste personalizada!</textarea>
            </div>

            <!-- Actions -->
            <div class="pt-1 flex gap-2">
                <button type="button" id="permBtn" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold py-1.5 px-3 rounded-lg transition-colors">
                    Permitir
                </button>
                <button type="submit" id="sendBtn" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold py-1.5 px-3 rounded-lg shadow-md transition-colors flex items-center justify-center gap-1">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                    Enviar
                </button>
            </div>
        </form>

        <!-- Simulated In-App Banner (Fallback & Preview) -->
        <div id="simulatedNotif" class="hidden transition-all transform duration-300 bg-slate-950/90 border border-emerald-500/50 p-2.5 rounded-lg shadow-2xl flex items-start gap-2.5 mt-2">
            <img id="simulatedIcon" class="w-8 h-8 rounded-md object-cover bg-slate-800 shrink-0 border border-slate-700" src="" alt="Icon">
            <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between gap-1">
                    <span id="simulatedApp" class="text-[10px] font-bold text-slate-400 uppercase tracking-wide truncate">Meu App</span>
                    <span class="text-[9px] text-slate-500">agora</span>
                </div>
                <h4 id="simulatedTitle" class="text-xs font-semibold text-slate-100 truncate">Título</h4>
                <p id="simulatedBody" class="text-[11px] text-slate-300 leading-snug line-clamp-2">Mensagem</p>
            </div>
            <button onclick="document.getElementById('simulatedNotif').classList.add('hidden')" class="text-slate-500 hover:text-slate-300 text-xs">✕</button>
        </div>

        <!-- Canvas oculto para redimensionamento de imagens -->
        <canvas id="canvas" class="hidden"></canvas>

    </div>

    <script>
        let iconDataUrl = null;

        const permStatusEl = document.getElementById('permissionStatus');
        const permBtn = document.getElementById('permBtn');
        const notifForm = document.getElementById('notifForm');
        const iconInput = document.getElementById('iconInput');
        const fileNameEl = document.getElementById('fileName');
        const toastEl = document.getElementById('toast');

        // Check permission state
        function updatePermissionUI() {
            if (!("Notification" in window)) {
                permStatusEl.textContent = 'Não suportado';
                permStatusEl.className = 'text-[10px] px-2 py-0.5 rounded-full font-medium bg-rose-500/20 text-rose-300 border border-rose-500/30';
                permBtn.disabled = true;
                return;
            }

            const permission = Notification.permission;
            if (permission === 'granted') {
                permStatusEl.textContent = 'Ativado';
                permStatusEl.className = 'text-[10px] px-2 py-0.5 rounded-full font-medium bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';
                permBtn.textContent = 'Ativo ✓';
                permBtn.disabled = true;
            } else if (permission === 'denied') {
                permStatusEl.textContent = 'Bloqueado';
                permStatusEl.className = 'text-[10px] px-2 py-0.5 rounded-full font-medium bg-rose-500/20 text-rose-300 border border-rose-500/30';
                permBtn.textContent = 'Bloqueado';
                permBtn.disabled = true;
            } else {
                permStatusEl.textContent = 'Pendente';
                permStatusEl.className = 'text-[10px] px-2 py-0.5 rounded-full font-medium bg-amber-500/20 text-amber-300 border border-amber-500/30';
                permBtn.textContent = 'Permitir';
                permBtn.disabled = false;
            }
        }

        updatePermissionUI();

        // Request permission action
        permBtn.addEventListener('click', () => {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    updatePermissionUI();
                    if (permission === 'granted') {
                        showToast('Permissão concedida!', 'success');
                    } else {
                        showToast('Permissão negada pelo usuário.', 'error');
                    }
                }).catch(() => {
                    showToast('Não foi possível solicitar permissão.', 'error');
                });
            }
        });

        // Redimensiona imagem para evitar erros com Data URLs muito grandes em Notificações
        iconInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                fileNameEl.textContent = file.name;
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.getElementById('canvas');
                        const ctx = canvas.getContext('2d');
                        // Redimensiona para no máximo 192x192 para garantir compatibilidade
                        const size = 192;
                        canvas.width = size;
                        canvas.height = size;
                        ctx.drawImage(img, 0, 0, size, size);
                        iconDataUrl = canvas.toDataURL('image/png');
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            } else {
                fileNameEl.textContent = 'Escolher...';
                iconDataUrl = null;
            }
        });

        // Show toast helper
        function showToast(message, type = 'success') {
            toastEl.textContent = message;
            if (type === 'success') {
                toastEl.className = 'text-xs p-2 rounded-lg bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 transition-all';
            } else {
                toastEl.className = 'text-xs p-2 rounded-lg bg-rose-500/20 text-rose-300 border border-rose-500/30 transition-all';
            }
            toastEl.classList.remove('hidden');
            setTimeout(() => {
                toastEl.classList.add('hidden');
            }, 3500);
        }

        // Show Simulated Notification inside the screen
        function showSimulatedNotification(appName, title, body, icon) {
            const simEl = document.getElementById('simulatedNotif');
            document.getElementById('simulatedApp').textContent = appName || 'Notificação';
            document.getElementById('simulatedTitle').textContent = title;
            document.getElementById('simulatedBody').textContent = body;
            
            const iconEl = document.getElementById('simulatedIcon');
            if (icon) {
                iconEl.src = icon;
                iconEl.classList.remove('hidden');
            } else {
                iconEl.classList.add('hidden');
            }

            simEl.classList.remove('hidden');
        }

        // Send notification form submit
        notifForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const title = document.getElementById('notifTitle').value;
            const body = document.getElementById('notifBody').value;
            const appName = document.getElementById('appName').value;

            // Mostra sempre a simulação visual dentro da tela
            showSimulatedNotification(appName, title, body, iconDataUrl);

            // Tenta disparar notificação nativa do sistema
            let nativeSuccess = false;

            const sendNative = (useIcon = true) => {
                try {
                    const fullTitle = appName ? `[${appName}] ${title}` : title;
                    const options = {
                        body: body,
                        tag: 'test-notif-' + Date.now()
                    };
                    
                    if (useIcon && iconDataUrl) {
                        options.icon = iconDataUrl;
                        options.badge = iconDataUrl;
                    }

                    const notif = new Notification(fullTitle, options);
                    nativeSuccess = true;
                    showToast('Notificação do sistema enviada!', 'success');
                } catch (err) {
                    console.warn('Erro ao disparar notificação com ícone, tentando sem ícone...', err);
                    if (useIcon && iconDataUrl) {
                        // Tenta novamente sem o ícone se o DataURL falhou no SO
                        sendNative(false);
                    } else {
                        showToast('Notificação exibida na tela (nativa bloqueada pelo SO/Navegador).', 'error');
                    }
                }
            };

            if ("Notification" in window && Notification.permission === 'granted') {
                sendNative(true);
            } else if ("Notification" in window && Notification.permission !== 'denied') {
                Notification.requestPermission().then(permission => {
                    updatePermissionUI();
                    if (permission === 'granted') {
                        sendNative(true);
                    } else {
                        showToast('Exibindo notificação simulada na tela.', 'success');
                    }
                });
            } else {
                showToast('Exibindo notificação simulada na tela.', 'success');
            }
        });
    </script>
</body>
</html>
