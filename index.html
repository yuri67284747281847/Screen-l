<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Exploração de Floresta 3D com Giroscópio & Passos Reais</title>
    <!-- Tailwind CSS para UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js para renderização 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- MediaPipe Hands & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030a06;
            font-family: 'Inter', sans-serif;

        #webcam {
            display: none;
        }
        /* Botão Minimalista de Entrada Imersiva */

            position: absolute;
            top: 0;

            background: rgba(4, 18, 10, 0.85);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <!-- Container da cena Three.js (Tela Cheia Imersiva) -->
    <div id="webgl-container"></div>

    <!-- Elemento de vídeo para entrada da câmera traseira (Oculto) -->
    <video id="webcam" playsinline></video>

    <!-- Overlay Minimalista de Inicialização de Sensores -->
    <div id="start-overlay">
        <button id="btn-start" class="px-8 py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-lg rounded-2xl shadow-2xl transform active:scale-95 transition-all flex items-center gap-3">
            <i class="fa-solid fa-play"></i> ENTRAR NA FLORESTA
        </button>
    </div>

    <!-- Script Principal -->
    <script>
        /**
         * CONFIGURAÇÕES GLOBAIS E SENSORES
         */
        const startOverlay = document.getElementById('start-overlay');
        const btnStart = document.getElementById('btn-start');

        let scene, camera, renderer;
        let handGroup, jointSpheres = [], boneCylinders = [];
        let interactiveObjects = [];
        let grabbedObject = null;
        let grabOffset = new THREE.Vector3();

        // Variáveis do Giroscópio
        let gyroActive = false;
        let targetQuaternion = new THREE.Quaternion();
        let baseEuler = new THREE.Euler(0, 0, 0, 'YXZ');

        // Detecção de Passos na Vida Real (Acelerômetro)
        let lastAccelMagnitude = 0;
        let stepThreshold = 1.6;
        let canTakeStep = true;

        // Estado da Pinça (Pinch)
        let isPinching = false;
        let pinchPosition = new THREE.Vector3();

        // Conexões do esqueleto da mão (Índices dos pontos do MediaPipe)
        const HAND_CONNECTIONS = [
            [0, 1], [1, 2], [2, 3], [3, 4],       // Polegar
            [0, 5], [5, 6], [6, 7], [7, 8],       // Indicador
            [5, 9], [9, 10], [10, 11], [11, 12],  // Médio
            [9, 13], [13, 14], [14, 15], [15, 16],// Anelar
            [13, 17], [0, 17], [17, 18], [18, 19], [19, 20] // Mínimo
        ];

        /**
         * CRIAR TERRENO E FLORESTA 3D
         */
        function createBeautifulForest() {
            // Terreno ondulado
            const groundGeo = new THREE.PlaneGeometry(120, 120, 48, 48);
            groundGeo.rotateX(-Math.PI / 2);
            const pos = groundGeo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i);
                const z = pos.getZ(i);
                pos.setY(i, Math.sin(x * 0.1) * Math.cos(z * 0.1) * 0.8);
            }
            groundGeo.computeVertexNormals();

            const groundMat = new THREE.MeshStandardMaterial({
                color: 0x112d1b,
                roughness: 0.9,
                metalness: 0.1
            });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.receiveShadow = true;
            scene.add(ground);

            // Objetos interativos (Gemas brilhantes flutuantes para pegar com a mão)
            const colors = [0xff0055, 0x00ccff, 0xffaa00, 0x00ffaa, 0xcc00ff];
            const gemGeo = new THREE.IcosahedronGeometry(0.08, 0);

            for (let i = 0; i < 6; i++) {
                const gemMat = new THREE.MeshStandardMaterial({
                    color: colors[i % colors.length],
                    emissive: colors[i % colors.length],
                    emissiveIntensity: 0.6,
                    roughness: 0.1,
                    metalness: 0.9
                });
                const gem = new THREE.Mesh(gemGeo, gemMat);

                const angle = (i / 6) * Math.PI * 2;
                const radius = 0.8 + Math.random() * 0.4;
                const posX = Math.cos(angle) * radius;
                const posZ = -1.2 + Math.sin(angle) * 0.4;
                const posY = 1.4 + (Math.random() * 0.3 - 0.15);

                gem.position.set(posX, posY, posZ);
                gem.userData.originalY = posY;
                gem.castShadow = true;
                scene.add(gem);
                interactiveObjects.push(gem);
            }
        }

        /**
         * INICIALIZAÇÃO DA CENA 3D (THREE.JS)
         */
        function initThreeJS() {
            const container = document.getElementById('webgl-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x04120a);
            scene.fog = new THREE.FogExp2(0x04120a, 0.035);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.05, 1000);
            camera.position.set(0, 1.6, 0);
            scene.add(camera);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0x234732, 0.9);
            scene.add(ambientLight);

            const moonLight = new THREE.DirectionalLight(0x88e3c9, 1.6);
            moonLight.position.set(20, 40, -10);
            moonLight.castShadow = true;
            scene.add(moonLight);

            const hemiLight = new THREE.HemisphereLight(0x2e5c38, 0x050b14, 0.7);
            scene.add(hemiLight);

            createBeautifulForest();
            createHandSkeleton();

            window.addEventListener('resize', onWindowResize);
        }

        /**
         * ESQUELETO DA MÃO 3D ATRELADO AO ESPAÇO DA CÂMERA
         */
        function createHandSkeleton() {
            handGroup = new THREE.Group();
            camera.add(handGroup);

            const jointMat = new THREE.MeshStandardMaterial({
                color: 0x00ffaa,
                roughness: 0.2,
                metalness: 0.8,
                emissive: 0x004422
            });

            const boneMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.3,
                metalness: 0.7
            });

            const jointGeo = new THREE.SphereGeometry(0.015, 16, 16);
            for (let i = 0; i < 21; i++) {
                const isPinchFinger = (i === 4 || i === 8);
                const sphere = new THREE.Mesh(jointGeo, isPinchFinger ? 
                    new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xaa0022 }) : jointMat);
                sphere.visible = false;
                handGroup.add(sphere);
                jointSpheres.push(sphere);
            }

            const cylinderGeo = new THREE.CylinderGeometry(0.008, 0.008, 1, 8);
            for (let i = 0; i < HAND_CONNECTIONS.length; i++) {
                const cylinder = new THREE.Mesh(cylinderGeo, boneMat);
                cylinder.visible = false;
                handGroup.add(cylinder);
                boneCylinders.push(cylinder);
            }
        }

        /**
         * ATUALIZAÇÃO DA MÃO 3D NO ESPAÇO LOCAL DA CÂMERA
         */
        function updateHandSkeleton(landmarks) {
            if (!landmarks || landmarks.length === 0) {
                jointSpheres.forEach(s => s.visible = false);
                boneCylinders.forEach(b => b.visible = false);
                return;
            }

            const worldPositions = [];

            landmarks.forEach((lm, idx) => {
                const x = (lm.x - 0.5) * 1.2;
                const y = -(lm.y - 0.5) * 1.0;
                const z = -0.4 - (lm.z * 0.8);

                const localPos = new THREE.Vector3(x, y, z);

                const worldPos = localPos.clone().applyMatrix4(camera.matrixWorld);
                worldPositions.push(worldPos);

                jointSpheres[idx].position.lerp(localPos, 0.6);
                jointSpheres[idx].visible = true;
            });

            HAND_CONNECTIONS.forEach((conn, index) => {
                const p1 = jointSpheres[conn[0]].position;
                const p2 = jointSpheres[conn[1]].position;

                const bone = boneCylinders[index];
                bone.visible = true;
                bone.position.copy(p1).add(p2).multiplyScalar(0.5);

                const distance = p1.distanceTo(p2);
                bone.scale.set(1, distance, 1);
                bone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), p2.clone().sub(p1).normalize());
            });

            const thumbTipWorld = worldPositions[4];
            const indexTipWorld = worldPositions[8];
            const pinchDistance = thumbTipWorld.distanceTo(indexTipWorld);

            pinchPosition.copy(thumbTipWorld).add(indexTipWorld).multiplyScalar(0.5);

            if (pinchDistance < 0.12) {
                if (!isPinching) {
                    isPinching = true;
                    tryGrabObject();
                }
            } else {
                if (isPinching) {
                    isPinching = false;
                    releaseObject();
                }
            }

            if (grabbedObject) {
                grabbedObject.position.copy(pinchPosition).sub(grabOffset);
            }
        }

        function tryGrabObject() {
            if (grabbedObject) return;

            let closestObj = null;
            let minDistance = 0.35;

            interactiveObjects.forEach(obj => {
                const dist = obj.position.distanceTo(pinchPosition);
                if (dist < minDistance) {
                    minDistance = dist;
                    closestObj = obj;
                }
            });

            if (closestObj) {
                grabbedObject = closestObj;
                grabOffset.copy(pinchPosition).sub(grabbedObject.position);
                grabbedObject.material.emissiveIntensity = 1.0;
            }
        }

        function releaseObject() {
            if (!grabbedObject) return;
            grabbedObject.material.emissiveIntensity = 0.6;
            grabbedObject = null;
        }

        /**
         * SENSORES DO CELULAR (GIROSCÓPIO & ACCELERÔMETRO)
         */
        function setupSensors() {
            btnStart.addEventListener('click', async () => {
                // Solicitar permissão de orientação (necessário no iOS)
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    try {
                        const state = await DeviceOrientationEvent.requestPermission();
                        if (state === 'granted') enableSensors();
                    } catch (e) {
                        console.error(e);
                    }
                } else {
                    enableSensors();
                }

                // Esconder overlay imediatamente
                startOverlay.style.opacity = '0';
                setTimeout(() => { startOverlay.style.display = 'none'; }, 500);

                // Iniciar a Câmera e o Rastreamento de Mão somente após o clique (Evita bloqueio de permissão)
                setupMediaPipe();
            });
        }

        function enableSensors() {
            window.addEventListener('deviceorientation', handleOrientation, true);
            window.addEventListener('devicemotion', handleMotion, true);
            gyroActive = true;
        }

        function handleOrientation(event) {
            if (event.alpha === null || event.beta === null || event.gamma === null) return;

            const alpha = THREE.MathUtils.degToRad(event.alpha || 0);
            const beta = THREE.MathUtils.degToRad(event.beta || 0);
            const gamma = THREE.MathUtils.degToRad(event.gamma || 0);

            baseEuler.set(beta - Math.PI / 2, alpha, -gamma, 'YXZ');
            targetQuaternion.setFromEuler(baseEuler);
        }

        function handleMotion(event) {
            const accel = event.accelerationIncludingGravity;
            if (!accel) return;

            const mag = Math.sqrt(accel.x * accel.x + accel.y * accel.y + accel.z * accel.z);
            const deltaMag = Math.abs(mag - lastAccelMagnitude);
            lastAccelMagnitude = mag;

            if (deltaMag > stepThreshold && canTakeStep) {
                const lookDirection = new THREE.Vector3();
                camera.getWorldDirection(lookDirection);
                lookDirection.y = 0;
                lookDirection.normalize();

                camera.position.addScaledVector(lookDirection, 0.65);

                canTakeStep = false;
                setTimeout(() => { canTakeStep = true; }, 350);
            }
        }

        /**
         * DETECÇÃO DE MÃO COM FALLBACK SEGURO
         */
        async function setupMediaPipe() {
            const videoElement = document.getElementById('webcam');

            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults((results) => {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    updateHandSkeleton(results.multiHandLandmarks[0]);
                } else {
                    updateHandSkeleton(null);
                }
            });

            // Estratégia de fallback progressiva para inicializar a câmera sem falhar
            let stream = null;
            try {
                // Tenta câmera traseira preferencial
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" }, width: { ideal: 640 }, height: { ideal: 480 } }
                });
            } catch (err) {
                console.warn("Falha na câmera preferencial, tentando qualquer vídeo:", err);
                try {
                    // Fallback para qualquer entrada de vídeo disponível
                    stream = await navigator.mediaDevices.getUserMedia({ video: true });
                } catch (fatalErr) {
                    console.error("Não foi possível acessar a câmera do dispositivo:", fatalErr);
                    return;
                }
            }

            videoElement.srcObject = stream;
            await videoElement.play();

            async function processVideoFrame() {
                if (videoElement.readyState >= 2) {
                    await hands.send({ image: videoElement });
                }
                requestAnimationFrame(processVideoFrame);
            }
            processVideoFrame();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (gyroActive) {
                camera.quaternion.slerp(targetQuaternion, 0.15);
            }

            const time = Date.now() * 0.002;
            interactiveObjects.forEach((obj, i) => {
                if (obj !== grabbedObject) {
                    obj.position.y = obj.userData.originalY + Math.sin(time + i) * 0.04;
                    obj.rotation.y += 0.01;
                }
            });

            renderer.render(scene, camera);
        }

        window.onload = () => {
            initThreeJS();
            setupSensors();
            animate();
        };
    </script>
</body>
</html>
